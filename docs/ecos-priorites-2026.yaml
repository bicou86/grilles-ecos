# Priorites de revision ECOS 2026 — TABLE CUREE A LA MAIN.
# Cette table n'est plus derivee d'une analyse de recurrence : elle est ecrite
# et maintenue a la main par l'utilisateur. build_priorites.py ne la regenere
# plus ; scripts/memento/audit_priorites.py se contente d'auditer la table
# contre la source, sans jamais la reecrire.
# `ssp` nomme une page « SSP — <nom>.md » du coffre ; cette page peut ne pas
# exister encore, c'est legitime — l'utilisateur la creera pour les plaintes
# frequentes a l'ECOS. check_priorites.py liste ces pages a creer sans faire
# echouer le controle.
# `tier` vaut incontournable, probable ou a connaitre.
