# Rattachements SSP absents de docs/obsidian-mapping.yaml.
# Forme : IDENTIFIANT: Nom exact de la page SSP (sans « SSP — » ni « .md »)
#
# Les neuf grilles officielles reprennent le nom declare dans la table CAS de
# scripts/build_obsidian_memento.py. Les autres sont jugees par lecture du
# contenu (titre AZYGOS, ou items d'anamnese/management pour RESCOS/AMBOSS/
# German) quand le nom de fichier seul ne suffisait pas a trancher.
#
# Quelques cas n'ont pas de page SSP existante et portent le nom de la SSP
# prioritaire correspondante (docs/ecos-priorites-2026.yaml) — la page reste
# a creer, cf. lib_ssp.specialite()/priorite() qui tolerent son absence.
# D'autres sont des exercices de communication (SD = Shared Decision, EM =
# Entretien Motivationnel, presentation de cas) : ils portent le nom de la
# page « Skills ECOS/Skills — ... » correspondante plutot qu'un diagnostic.

