# Reconciliation entre le libelle precis d'un diagnostic de cas
# (docs/ecos-diagnostics.yaml) et le libelle de la table de priorites 2026
# (docs/ecos-priorites-2026.yaml, champ `diagnostics`), quand les deux
# divergent parce que le cas est plus specifique (stade, laterite,
# mecanisme...) que la categorie de la table de priorites.
#
# Forme : Libelle precis de la table des diagnostics: Libelle de priorites
#
# La table principale (docs/ecos-diagnostics.yaml) GARDE sa valeur precise :
# cet alias dit seulement a quelle categorie de priorites elle correspond,
# pour que les sous-blocs de management par diagnostic (tache 9) se
# rejoignent. Meme patron que docs/ecos-ssp-alias.yaml.
#
# Premier remplissage propose par l'assistant (tache 6, ronde de correction
# 1/5) — a corriger par l'utilisateur. Chaque ligne est un jugement clinique
# (« Trouble panique » rejoint « Trouble anxieux », pas l'inverse) : un alias
# faux fusionnerait deux diagnostics distincts au moment de la fusion par
# diagnostic — a relire avec soin plutot qu'a prendre pour acquis.
