# SECOND TOUR DU 2026-08-16 — les 90 paires « à juger » du rapport régénéré
# ══════════════════════════════════════════════════════════════════════════
#
# Réunir des libellés en rapproche d'autres : le rapport régénéré après le
# premier tour proposait 90 paires neuves. 66 sont réunies ici, 24 refusées.
# TROIS RÈGLES ONT CHANGÉ, chacune parce que le premier tour a coûté quelque
# chose.
#
# ① LA NÉGATION EST VUE. Le premier tour a retenu cinq fois la forme NÉGATIVE
# comme intitulé (« Hépatomégalie » → « Pas d'hépatomégalie ») et il a fallu
# inverser les cinq à la main. `lib_vocabulaire.NEGATIONS` connaît maintenant
# « pas », « sans », « non », « absence », « aucun », « aucune », « jamais » ;
# `report_doublons` marque chaque paire dont un seul côté nie, et la
# PROPRIÉTÉ 10 de `check_vocabulaire` REFUSE une entrée dont la cible nie ce
# que la clé affirmait. Les six entrées de cette table qui redressent une
# négation vers le positif en sont le témoin.
#
# ② LE LIBELLÉ RETENU DOIT DÉCRIRE L'UNION, et non être le plus long. La règle
# du « plus explicite » retenait en pratique le plus long, donc parfois le plus
# ÉTROIT : réunir sous « Symptômes associés - fièvre » des items qui
# demandaient TOUS les symptômes associés. Le critère appliqué est
# mécanique — LE LIBELLÉ RETENU NE DOIT PAS AJOUTER UNE EXIGENCE QUE L'AUTRE
# GRILLE N'A PAS FAITE : « Radiographie thoracique face et profil » demande
# deux incidences que « Radiographie thoracique » ne demandait pas, donc c'est
# le générique qui l'emporte. Il ne s'applique PAS à un composé qui nomme les
# deux pôles d'un même axe (« Nausées/Vomissements », « Facteurs
# atténuants/aggravants »), qui élargit au lieu de rétrécir. La règle « une
# cible déjà adjugée la conserve » reste prioritaire, et c'est elle qui produit
# la seule exception de ce tour, signalée sur sa ligne (Syncope, « Auscultation
# pulmonaire » → « ... bilatérale »).
#
# ③ DEUX OBJETS CLINIQUES DIFFÉRENTS NE SONT PAS UNE REFORMULATION. Le premier
# tour a réuni neuf paires que l'auteur a dû retirer (« Culture mycologique » /
# « Culture bactériologique », « Inspection des sclères » / « des
# conjonctives »). Le motif est toujours le même : les mots COMMUNS sont
# génériques (« Culture », « Inspection », « Troubles », « Antécédents ») et la
# différence tient dans le seul mot qui porte le sens. Les 24 paires refusées
# ce tour le sont pour ce motif, plus deux cas où le même générique porte deux
# SOUS-CAS différents (« Transit intestinal - diarrhée » / « ... et gaz ») :
# aucun des deux libellés ne décrit alors l'union, et il n'y a pas de générique
# à retenir à leur place. Elles reviendront dans chaque rapport régénéré ; ce
# n'est pas du stock, c'est du bruit lexical permanent.
