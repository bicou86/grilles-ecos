# Vocabulaire canonique, par SSP. Couche B de l'appariement.
# Forme :
#   "Douleur Thoracique":
#     "Douleurs": Caractérisation de la douleur
#
# EXCEPTION ASSUMÉE — « Anamnèse familiale » → « Antécédents familiaux » sur
# Fatigue. Le brief demande de retenir, quand elle existe, la forme d'une des
# neuf grilles officielles : ici RESCOS-67b (officielle) écrit « Anamnèse
# familiale ». Mais RESCOS-9b, officielle elle aussi, écrit « Antécédents
# familiaux » (Boiterie de l'Enfant). Les officielles se contredisent, la règle
# ne tranche plus, et c'est la cohérence de la famille qui décide : la même
# cible sur les dix SSP concernées.
#
# LOT 2 — les 27 entrées ajoutées à l'ouverture du lot 2 (13 SSP) ne créent
# AUCUNE famille nouvelle : ce sont les familles déjà adjugées en tâche 10,
# appliquées aux SSP qui entrent en périmètre. Une famille nouvelle est un
# jugement clinique neuf ; une famille déjà adjugée est un jugement déjà rendu
# et déjà relu. Chaque application reste jugée séparément par les neuf
# propriétés — 14 propositions sur 41 sont tombées sur la propriété 7.
#
# EXCEPTION INVERSE, sur Rectorragies & Hémorragie Digestive Basse :
# « Habitudes et mode de vie » → « Habitudes », et non l'inverse comme sur les
# sept autres SSP de cette famille. RESCOS-58b est une grille OFFICIELLE et
# écrit « Habitudes » ; aucune autre officielle ne la contredit ici, la règle
# du référentiel tranche donc, contrairement au cas d'« Anamnèse familiale »
# ci-dessus. Elle tranche d'ailleurs dans le sens que la règle de l'axe de
# contenu indiquait déjà : « et mode de vie » recouvre chez AMBOSS-11 le
# domicile, l'occupation et l'alimentation, que l'officielle n'a pas demandés.
#
