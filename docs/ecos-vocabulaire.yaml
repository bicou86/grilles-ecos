# CURATION EN MASSE DU 2026-08-16 — les paires « à juger » du rapport
# ══════════════════════════════════════════════════════════════════════════
#
# L'auteur a demandé de réunir TOUTES les paires « à juger » de
# docs/superpowers/rapport-doublons-memento.md, les deux sous-seaux (écart de
# forme ET écart de contenu). C'est fait. Ce qui suit dit COMMENT, parce que
# la décision de détail — quel libellé est retenu, quelle paire est risquée —
# a été prise mécaniquement et doit pouvoir être auditée.
#
# LIBELLÉ RETENU. Dans l'ordre : (1) une cible déjà adjugée dans cette table
# la conserve — un jugement rendu ne se rejoue pas ; (2) sinon le libellé
# d'une des neuf grilles OFFICIELLES (lib_ssp.OFFICIELLES) l'emporte, quand
# une seule d'entre elles est en jeu ; (3) sinon le PLUS EXPLICITE — le plus
# de mots pleins, puis le plus long — jamais l'abréviation. Un qualificatif
# qui n'est qu'un seuil de notation (« (au moins 2-3) », « (si applicable) »)
# ne compte pas dans l'explicitation : c'est de la notation, pas de la
# clinique.
#
# LES DEUX SECTIONS, ET POURQUOI ELLES SONT DANS LE MÊME FICHIER. Le lecteur
# YAML du projet refuse de rouvrir un groupe déjà ouvert (lib_yaml.lire_groupe),
# donc une SSP ne peut pas apparaître deux fois. La séparation est donc
# INTERNE à chaque SSP : les réunions sûres d'abord, puis une bannière « ② À
# RELIRE » et les réunions qui effacent une distinction clinique, une ligne et
# un commentaire chacune. Chaque ligne de ② est indépendante des autres.
#
# CE QUI PART EN ②, exactement. La règle reproduit les quinze cas que le brief
# et le rapport nomment, y compris les deux que l'auteur signale lui-même
# comme sortant du motif (« Antécédents de céphalées » ⟷ « Antécédents et
# allergies » ; « Examen des aires axillaires » ⟷ « Examen des autres aires
# ganglionnaires ») :
#
#   - SUBSTITUTION — chaque côté porte un mot de contenu que l'autre n'a pas
#     (« abdominale » / « vaginale », « initiaux » / « urgents », « la
#     patiente » / « le parent »). Les deux mots s'opposent : ② sans exception.
#   - AJOUT — un seul côté porte le mot en trop. C'est le motif que l'auteur
#     donne pour sûr (« Antécédents et allergies » ⊂ « Antécédents MÉDICAUX et
#     allergies », « Auscultation préalable » ⊂ « INSPECTION et auscultation
#     préalables »). L'ajout ne part en ② que s'il nomme un SOUS-CAS :
#     « urgents », « droit », « fièvre », « pas de… ».
#
# Un mot d'accord, de graphie, de manière ou de procédure ne compte jamais
# comme un mot de contenu ; le geste précis non plus quand il répond à un
# terme générique, l'auteur réunissant lui-même « Examen des ganglions » et
# « Palpation des aires ».
#
# CE QUE CETTE SECTION NE COUVRE PAS. Les paires dont AUCUNE grille ne porte
# les deux libellés restent hors de portée de la propriété 8 : le tri ci-dessus
# est lexical, pas clinique.
#
